<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>M2 수련회 매뉴얼_by JL</title>
  <style>
    body{font-family:system-ui,-apple-system; margin:0; padding:40px; background:#0b0f19; color:#eaf0ff;}
    .wrap{max-width:900px; margin:0 auto;}
    a{color:#eaf0ff; text-decoration:none}
    .grid{display:grid; gap:14px; grid-template-columns:1fr; margin-top:18px;}
    @media(min-width:720px){.grid{grid-template-columns:1fr 1fr 1fr}}
    .card{border:1px solid rgba(255,255,255,.14); border-radius:16px; padding:16px; background:rgba(255,255,255,.04);}
    .card:hover{border-color:rgba(255,255,255,.30)}
    .muted{color:rgba(234,240,255,.75); line-height:1.5}
    h1{margin:0 0 8px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📘 M2 수련회 매뉴얼_by JL</h1>
    <div class="muted">아래에서 파트별(음향/조명/자막) 매뉴얼로 이동하세요.</div>

    <div class="grid">
      <a class="card" href="./audio/">
        <h2>🎚️ 음향</h2>
        <div class="muted">Wing / AES50 / P16 / 무선마이크 / PA / 설치·운영 체크리스트</div>
      </a>
      <a class="card" href="./lighting/">
        <h2>💡 조명</h2>
        <div class="muted">Lightkey / ENTTEC / 무선 DMX / 씬 / TD-17 킥 트리거</div>
      </a>
      <a class="card" href="./captions/">
        <h2>🖥️ 자막(프로프레젠터)</h2>
        <div class="muted">PP7 맥북 / 빔/스크린 / HDMI/젠더 / 운영 플로우</div>
      </a>
    </div>
  </div>
</body>
</html>
